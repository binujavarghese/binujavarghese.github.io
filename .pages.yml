# Pages CMS settings: this gives you a visual editor at https://app.pagescms.org
media:
  input: src/images
  output: /images

content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, topic, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short summary (shown on cards)
        type: text
      - name: date
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd
      - name: topic
        label: Topic
        type: select
        required: true
        options:
          values: ["Psychology & Research", "Motivation", "Mindset", "Habits", "Reflections"]
      - name: image
        label: Cover image (optional)
        type: image
      - name: featured
        label: Show in "Start with these" on the homepage
        type: boolean
      - name: draft
        label: Draft (hide from the site)
        type: boolean
      - name: body
        label: Post
        type: rich-text

  - name: about
    label: About me page
    type: file
    path: src/pages/about.md
    fields:
      - name: layout
        type: string
        hidden: true
        default: layouts/page.njk
      - name: permalink
        type: string
        hidden: true
        default: /about/
      - name: title
        label: Title
        type: string
      - name: description
        label: Subtitle
        type: text
      - name: body
        label: Page
        type: rich-text
  - name: newsletter
    label: Newsletter page
    type: file
    path: src/_data/newsletter.json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: intro, label: Intro text, type: text }
      - { name: buttonText, label: Button text, type: string }
      - { name: formAction, label: Kit form address (for the email box), type: string }
      - { name: signupLink, label: Sign-up link (used if the Kit form address is empty), type: string }
      - { name: note, label: Small note under the button, type: string }
      - { name: testimonialsIntro, label: Line above testimonials, type: string }
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - { name: quote, label: What they said, type: text }
          - { name: name, label: Their name (and role or place), type: string }
  - name: site
    label: Site settings
    type: file
    path: src/_data/site.json
    fields:
      - { name: name, label: Your name, type: string }
      - { name: firstName, label: First name, type: string }
      - { name: title, label: Browser tab title, type: string }
      - { name: description, label: Site description, type: text }
      - { name: eyebrow, label: Small line above the headline, type: string }
      - { name: headline, label: Homepage headline, type: text }
      - { name: intro, label: Homepage intro, type: text }
      - { name: email, label: Contact email, type: string }
      - { name: newsletterUrl, label: Newsletter subscribe link, type: string }
      - { name: photo, label: Your photo, type: image }
      - { name: heroPhoto, label: Homepage background photo, type: image }
      - { name: headlineHighlight, label: Words to highlight in the headline, type: string }
      - name: quote
        label: Homepage quote
        type: object
        fields:
          - { name: text, label: Quote, type: text }
          - { name: author, label: Author, type: string }
      - name: social
        label: Social links (leave empty to hide)
        type: object
        fields:
          - { name: instagram, label: Instagram URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: x, label: X / Twitter URL, type: string }
      - name: topics
        label: Topics
        type: object
        list: true
        fields:
          - { name: name, label: Topic name, type: string }
          - { name: description, label: Description, type: text }
